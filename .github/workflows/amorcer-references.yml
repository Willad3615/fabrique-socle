name: Amorcer les références visuelles

# À lancer UNE SEULE FOIS, à la main. Génère les images de référence
# de la régression visuelle et les commite. À supprimer après usage.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Générer les références
        continue-on-error: true
        run: npx playwright test apparence --update-snapshots
      - name: Committer les références
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e
          git diff --staged --quiet && echo "Rien à committer." && exit 0
          git commit -m "Ajoute les références visuelles (générées par la CI)"
          git push
