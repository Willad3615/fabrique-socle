name: Amorcer le verrou de dépendances

# À lancer UNE SEULE FOIS, à la main, depuis l'onglet Actions.
# Génère package-lock.json et le commite sur main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verrou:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Committer le verrou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet && echo "Rien à committer." && exit 0
          git commit -m "Ajoute package-lock.json (généré par la CI)"
          git push
